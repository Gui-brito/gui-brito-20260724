services:
  db:
    image: postgres:16-alpine
    container_name: gestao-db
    environment:
      POSTGRES_DB: gestao_colaboradores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestao-backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=gestao_colaboradores;Username=postgres;Password=postgres123
      - Jwt__Key=ChaveSecretaParaDesenvolvimento2024MuitoSegura
      - Jwt__ExpirationInHours=8
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestao-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
